<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stilistic — Магазин одежды</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --background-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Шапка сайта */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .catalog-title {
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        /* Карточка товара */
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .product-image-container {
            width: 100%;
            height: 220px;
            background-color: #edf2f7;
            overflow: hidden;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-brand {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 18px;
        }

        .btn-details {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn-details:hover {
            background-color: #34495e;
        }
        .empty-catalog {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Stilistic.store</h1>
        <div>Каталог</div>
    </header>

    <div class="container">
        <h2 class="catalog-title">Новая коллекция</h2>

        <div class="products-grid">
            {% for product in products %}
                <div class="product-card">
                    <div class="product-image-container">
                        {% if product.image %}
                            <img src="{{ product.image.url }}" alt="{{ product.name }}">
                        {% else %}
                            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #a0aec0; font-size: 14px;">Нет фото</div>
                        {% endif %}
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-brand">{{ product.brand }}</div>
                            <h3 class="product-title">{{ product.name }}</h3>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">{{ product.price }} ₽</span>
                            <a href="#" class="btn-details">Подробнее</a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="empty-catalog">
                    Пока что в каталоге нет добавленных товаров. Загляните в админку!
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
