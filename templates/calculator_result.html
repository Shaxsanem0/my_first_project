<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат</title>
</head>
<body>
    <h2>Результат вычисления</h2>

    {% if error %}
        <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% else %}
        <h1>{{ num1 }} {{ symbol }} {{ num2 }} = {{ result }}</h1>
    {% endif %}

    <br>
    <a href="/calculator/">Назад к калькулятору</a>
</body>
</html>
